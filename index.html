<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多聞くん今どっち!?グッズ情報局 | リンク集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique:wght@400;500;700;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF8F9;
    --surface: #FCEEF0;
    --surface-2: #F8E1E6;
    --gold: #D46A8C;
    --gold-bright: #B94E71;
    --gold-dim: #E8A6BC;
    --text: #4A2530;
    --text-muted: #9C6E7C;
    --line: rgba(212,106,140,0.35);
    --line-soft: rgba(212,106,140,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(212,106,140,0.07), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(212,106,140,0.06), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic Antique', sans-serif;
    padding:56px 20px 80px;
    line-height:1.8;
  }
  .wrap{max-width:720px;margin:0 auto;}

  .title-block{
    text-align:center;
    margin-bottom:0;
  }
  .title-img{
    max-width:360px;
    width:80%;
    height:auto;
  }
  .title-sub{
    font-family:'Mochiy Pop One', sans-serif;
    font-weight:400;
    font-size:clamp(26px, 5.5vw, 36px);
    color:var(--gold);
    -webkit-text-stroke:5px #FFFFFF;
    paint-order:stroke fill;
    letter-spacing:0.06em;
    margin-top:-14px;
  }
  .subtitle{
    text-align:center;
    font-size:15px;
    color:var(--text-muted);
    margin-bottom:6px;
  }

  .ornament{
    text-align:center;
    letter-spacing:14px;
    font-size:15px;
    margin:0 auto 44px;
    max-width:420px;
  }

  .section{margin-bottom:52px;}
  .ticket{
    display:flex;
    align-items:stretch;
    max-width:140px;
    margin-bottom:24px;
    border:1px dashed var(--line);
    border-radius:6px;
    background:var(--surface);
    box-shadow:0 1px 5px rgba(212,106,140,0.10);
  }
  .ticket-main{
    flex:1;
    padding:6px 9px;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .ticket-eyebrow{
    font-size:6px;
    letter-spacing:0.25em;
    color:var(--text-muted);
    text-transform:uppercase;
  }
  .ticket-title{
    font-family:'Zen Kaku Gothic Antique', sans-serif;
    font-weight:700;
    font-size:17px;
    color:var(--gold-bright);
    letter-spacing:0.08em;
  }
  .ticket-divider{
    position:relative;
    border-left:1px dashed var(--line);
    margin:4px 0;
  }
  .ticket-divider::before,
  .ticket-divider::after{
    content:"";
    position:absolute;
    left:50%;
    width:8px;
    height:8px;
    background:var(--bg);
    border-radius:50%;
  }
  .ticket-divider::before{top:0;transform:translate(-50%,-50%);}
  .ticket-divider::after{bottom:0;transform:translate(-50%,50%);}
  .ticket-stub{
    width:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:5px 0;
    writing-mode:vertical-rl;
    font-size:6px;
    letter-spacing:0.15em;
    color:var(--text-muted);
    text-transform:uppercase;
  }

  .shop-list{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--line);
  }
  .shop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:20px 6px;
    border-bottom:1px solid var(--line);
    transition:background 0.2s ease;
  }
  .shop:hover{background:var(--surface);}

  .shop-left{display:flex;align-items:baseline;gap:14px;}
  .shop-index{
    font-size:15px;
    display:inline-block;
    min-width:20px;
    transition:transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .shop:hover .shop-index{
    transform:rotate(-18deg) scale(1.25) translateY(-3px);
  }
  .shop-name{
    font-size:17px;
    font-weight:500;
    color:var(--text);
    letter-spacing:0.02em;
  }

  .shop-link{
    flex-shrink:0;
    font-size:12.5px;
    color:var(--gold-bright);
    text-decoration:none;
    border:1px solid var(--gold-dim);
    padding:8px 16px;
    border-radius:2px;
    letter-spacing:0.05em;
    transition:all 0.2s ease;
    white-space:nowrap;
  }
  .shop-link:hover{
    background:var(--gold);
    color:#100D08;
    border-color:var(--gold);
  }

  @media (max-width:480px){
    .shop{flex-direction:column;align-items:flex-start;gap:10px;}
    .shop-link{align-self:flex-start;}
  }
</style>
</head>
